<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>هّمة — نحو يوم أفضل</title>
    <meta name="description" content="هّمة هو نظامك الشخصي لتنظيم يومك، إدارة مهامك، بناء عاداتك وتحقيق أهدافك." />
    <meta name="theme-color" content="#080B12" />
    <meta property="og:title" content="هّمة — نحو يوم أفضل" />
    <meta property="og:description" content="هّمة هو نظامك الشخصي لتنظيم يومك، إدارة مهامك، بناء عاداتك وتحقيق أهدافك." />
    <meta property="og:image" content="./brand/icon-192.png" />
    <meta property="og:locale" content="ar_SA" />
    <link rel="icon" type="image/png" href="./brand/favicon.png" />
    <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* شاشة التحميل قبل تشغيل التطبيق */
      html,body{margin:0;background:#080B12}
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,rgba(124,92,255,.18),transparent 70%),#080B12;z-index:9999;transition:opacity .4s ease}
      #boot img{width:96px;height:96px;border-radius:26px;animation:bootPulse 1.6s ease-in-out infinite;box-shadow:0 0 60px rgba(124,92,255,.45)}
      @keyframes bootPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
    </style>
  </head>
  <body>
    <div id="boot"><img src="./brand/icon.webp" alt="هّمة" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
